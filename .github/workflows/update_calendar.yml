name: Uppdatera Sportkalender

on:
  schedule:
    - cron: '0 6 * * *' # Körs varje morgon kl 06:00
  workflow_dispatch: # Gör att du kan köra den manuellt från hemsidan

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repository
        uses: actions/checkout@v3

      - name: Installera Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installera nödvändiga paket
        run: |
          pip install requests icalendar

      - name: Kör skrapa-skriptet
        run: python scraper.py

      - name: Spara och pusha ändringar
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Automatiskt uppdaterad kalender.ics"
          file_pattern: kalender.ics
