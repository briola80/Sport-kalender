name: Uppdatera Matchkalender Automatisk

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installera beroenden
        run: |
          pip install icalendar requests

      - name: Kör skrapa-skriptet
        run: python scraper.py

      - name: Spara och publicera ändringar i repot
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add kalender.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatiskt uppdaterad matchkalender" && git push)
