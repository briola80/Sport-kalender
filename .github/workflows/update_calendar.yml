name: Uppdatera Sportkalender

on:
  schedule:
    # Körs automatiskt varje natt kl 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Gör att du även kan starta skriptet manuellt vid behov

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Kör scraper
        run: python scraper.py

      - name: Commit och pusha ändringar
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add kalender.ics
          git commit -m "Auto-uppdaterade kalender.ics med sändande kanal" || exit 0
          git push
