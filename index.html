<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olausson Sportkalender & Kanaler</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --primary: #0056b3;
            --accent: #28a745;
            --text: #212529;
            --text-muted: #6c757d;
            --border: #dee2e6;
            --radius: 12px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 6px;
            text-align: center;
            color: var(--primary);
        }
        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 16px;
        }
        .filter-section {
            margin-bottom: 14px;
        }
        .filter-label {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }
        .filters {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .filter-btn {
            background: #e9ecef;
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
        }
        .filter-btn.active {
            background: var(--primary);
            color: white;
        }
        .match-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 450px;
            overflow-y: auto;
            margin-bottom: 16px;
            padding-right: 4px;
        }
        .match-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            transition: border-color 0.2s;
        }
        .match-card.selected {
            border-color: var(--accent);
            background: #f4faf5;
        }
        .match-info {
            flex-grow: 1;
        }
        .match-teams {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }
        .match-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .match-channel {
            color: var(--primary);
            font-weight: 600;
        }
        .match-checkbox {
            transform: scale(1.2);
            cursor: pointer;
            margin-left: 10px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        button.action-btn {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        button.action-btn:hover {
            opacity: 0.9;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sportkalender & Kanaler</h1>
    <div class="subtitle">Filtrera efter sport och liga, markera favoriter och ladda ner din .ics-fil</div>

    <!-- Sportfilter -->
    <div class="filter-section">
        <span class="filter-label">Sport</span>
        <div class="filters" id="sportFilters">
            <button class="filter-btn active" onclick="setSportFilter('all')">Alla sporter</button>
            <button class="filter-btn" onclick="setSportFilter('Fotboll')">Fotboll</button>
            <button class="filter-btn" onclick="setSportFilter('Ishockey')">Ishockey</button>
        </div>
    </div>

    <!-- Liga / Kategori-filter (Ändras dynamiskt baserat på sport) -->
    <div class="filter-section">
        <span class="filter-label">Liga / Turnering</span>
        <div class="filters" id="leagueFilters">
            <!-- Fylls i dynamiskt av JavaScript -->
        </div>
    </div>

    <div class="status-row">
        <span style="cursor:pointer; color:var(--primary);" onclick="toggleSelectAll()">Markera / Avmarkera alla synliga</span>
        <span id="selected-count">0 valda</span>
    </div>

    <!-- Matchlista -->
    <div class="match-list" id="matchList"></div>

    <!-- Exportknapp -->
    <div class="actions">
        <button class="action-btn" onclick="generateICS()">Ladda ner .ics för valda favoriter</button>
    </div>
</div>

<script>
    // Komplett databas med både hockey, fotboll, storligor och landslag
    const matches = [
        // Ishockey - SHL & SDHL & Landslag
        { id: 1, sport: "Ishockey", league: "SHL", title: "Frölunda HC - Malmö Redhawks", datetime: "2026-11-12T19:00:00", channel: "TV4 Play Hockey / TV12", selected: true },
        { id: 2, sport: "Ishockey", league: "SHL", title: "Frölunda HC - Färjestad BK", datetime: "2026-11-19T19:00:00", channel: "TV4 Play Hockey", selected: true },
        { id: 3, sport: "Ishockey", league: "SHL", title: "Luleå HF - Frölunda HC", datetime: "2026-11-24T19:00:00", channel: "TV4 Play Hockey", selected: false },
        { id: 4, sport: "Ishockey", league: "SHL", title: "Frölunda HC - Skellefteå AIK", datetime: "2026-11-29T15:15:00", channel: "TV4 / TV4 Play", selected: false },
        { id: 5, sport: "Ishockey", league: "SDHL", title: "Frölunda HC - Luleå HF", datetime: "2026-11-25T18:00:00", channel: "SVT Play", selected: false },
        { id: 6, sport: "Ishockey", league: "Landskamp", title: "Sverige - Schweiz (Dam)", datetime: "2026-11-13T19:00:00", channel: "SVT Play / SVT2", selected: true },
        { id: 7, sport: "Ishockey", league: "Landskamp", title: "Sverige - Finland (Beijer Hockey Games)", datetime: "2026-12-04T19:00:00", channel: "SVT / Viaplay", selected: false },

        // Fotboll - Allsvenskan, Elitettan & Landskamp
        { id: 8, sport: "Fotboll", league: "Allsvenskan", title: "Hammarby IF - IFK Göteborg", datetime: "2026-11-23T19:00:00", channel: "Max / Discovery+", selected: true },
        { id: 9, sport: "Fotboll", league: "Allsvenskan", title: "IFK Göteborg - IK Sirius", datetime: "2026-11-29T15:00:00", channel: "Max / Discovery+", selected: false },
        { id: 10, sport: "Fotboll", league: "Elitettan", title: "IFK Göteborg - Umeå IK", datetime: "2026-11-14T13:00:00", channel: "SVT Play", selected: true },
        { id: 11, sport: "Fotboll", league: "Landskamp", title: "Sverige - Bosnien & Hercegovina (Herr)", datetime: "2026-11-14T20:45:00", channel: "Viaplay / TV6", selected: true },
        { id: 12, sport: "Fotboll", league: "Landskamp", title: "Polen - Sverige (Herr)", datetime: "2026-11-17T20:45:00", channel: "Viaplay / TV6", selected: true },

        // Fotboll - Premier League
        { id: 13, sport: "Fotboll", league: "Premier League", title: "Arsenal - Chelsea", datetime: "2026-11-22T16:00:00", channel: "Viaplay", selected: false },
        { id: 14, sport: "Fotboll", league: "Premier League", title: "Manchester City - Liverpool", datetime: "2026-11-22T18:30:00", channel: "Viaplay", selected: false },
        { id: 15, sport: "Fotboll", league: "Premier League", title: "Manchester United - Tottenham", datetime: "2026-11-29T17:30:00", channel: "Viaplay", selected: false },

        // Fotboll - La Liga
        { id: 16, sport: "Fotboll", league: "La Liga", title: "Real Madrid - Barcelona (El Clásico)", datetime: "2026-11-23T21:00:00", channel: "TV4 Play / TV4 Sportkanalen", selected: false },
        { id: 17, sport: "Fotboll", league: "La Liga", title: "Atletico Madrid - Valencia", datetime: "2026-11-28T18:30:00", channel: "TV4 Play", selected: false },

        // Fotboll - Champions League
        { id: 18, sport: "Fotboll", league: "Champions League", title: "Real Madrid - Liverpool", datetime: "2026-11-25T21:00:00", channel: "Viaplay / TV4 Play", selected: false },
        { id: 19, sport: "Fotboll", league: "Champions League", title: "Bayern München - Paris Saint-Germain", datetime: "2026-11-26T21:00:00", channel: "Viaplay", selected: false }
    ];

    let activeSport = 'all';
    let activeLeague = 'all';

    function setSportFilter(sport) {
        activeSport = sport;
        activeLeague = 'all'; // Återställ liga när sport byts

        document.querySelectorAll('#sportFilters .filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        updateLeagueButtons();
        renderMatches();
    }

    function setLeagueFilter(league) {
        activeLeague = league;
        document.querySelectorAll('#leagueFilters .filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderMatches();
    }

    function updateLeagueButtons() {
        const leagueFiltersEl = document.getElementById('leagueFilters');
        leagueFiltersEl.innerHTML = '';

        // Hämta unika ligor baserat på vald sport
        let availableLeagues = ['all'];
        matches.forEach(m => {
            if (activeSport === 'all' || m.sport === activeSport) {
                if (!availableLeagues.includes(m.league)) {
                    availableLeagues.push(m.league);
                }
            }
        });

        availableLeagues.forEach(league => {
            const btn = document.createElement('button');
            btn.className = `filter-btn ${activeLeague === league ? 'active' : ''}`;
            btn.innerText = league === 'all' ? 'Alla ligor' : league;
            btn.onclick = () => setLeagueFilter(league);
            leagueFiltersEl.appendChild(btn);
        });
    }

    function renderMatches() {
        const listEl = document.getElementById('matchList');
        listEl.innerHTML = '';

        const filtered = matches.filter(m => {
            const matchSport = (activeSport === 'all' || m.sport === activeSport);
            const matchLeague = (activeLeague === 'all' || m.league === activeLeague);
            return matchSport && matchLeague;
        });

        if (filtered.length === 0) {
            listEl.innerHTML = '<div style="text-align:center; color:#6c757d; padding: 20px;">Inga matcher hittades för detta filter.</div>';
            return;
        }

        filtered.forEach(m => {
            const card = document.createElement('div');
            card.className = `match-card ${m.selected ? 'selected' : ''}`;
            card.onclick = (e) => {
                if(e.target.type !== 'checkbox') {
                    m.selected = !m.selected;
                    renderMatches();
                }
            };

            const dateFormatted = new Date(m.datetime).toLocaleString('sv-SE', {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            card.innerHTML = `
                <div class="match-info">
                    <div class="match-teams">${m.title}</div>
                    <div class="match-meta">
                        <span>📅 ${dateFormatted}</span>
                        <span>🏆 ${m.league}</span>
                        <span class="match-channel">📺 ${m.channel}</span>
                    </div>
                </div>
                <input type="checkbox" class="match-checkbox" ${m.selected ? 'checked' : ''} onchange="toggleMatch(${m.id})">
            `;
            listEl.appendChild(card);
        });

        updateCount();
    }

    function toggleMatch(id) {
        const match = matches.find(m => m.id === id);
        if(match) {
            match.selected = !match.selected;
            renderMatches();
        }
    }

    function toggleSelectAll() {
        const filtered = matches.filter(m => {
            return (activeSport === 'all' || m.sport === activeSport) && (activeLeague === 'all' || m.league === activeLeague);
        });
        const allSelected = filtered.every(m => m.selected);
        filtered.forEach(m => m.selected = !allSelected);
        renderMatches();
    }

    function updateCount() {
        const count = matches.filter(m => m.selected).length;
        document.getElementById('selected-count').innerText = `${count} valda`;
    }

    function generateICS() {
        const selectedMatches = matches.filter(m => m.selected);
        if(selectedMatches.length === 0) {
            alert('Välj minst en match som favorit först!');
            return;
        }

        let icsRows = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//Olausson Sportkalender//SV",
            "CALSCALE:GREGORIAN",
            "METHOD:PUBLISH"
        ];

        selectedMatches.forEach(m => {
            const startObj = new Date(m.datetime);
            const endObj = new Date(startObj.getTime() + 150 * 60000);

            const formatICSDate = (d) => {
                const pad = n => String(n).padStart(2, '0');
                return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
            };

            const dtstart = formatICSDate(startObj);
            const dtend = formatICSDate(endObj);

            icsRows.push(
                "BEGIN:VEVENT",
                `UID:sportmatch-${m.id}-${Date.now()}@sportkalender.local`,
                `DTSTAMP:${dtstart}`,
                `DTSTART:${dtstart}`,
                `DTEND:${dtend}`,
                `SUMMARY:${m.title} (${m.league})`,
                `DESCRIPTION:Sänds på ${m.channel}`,
                `LOCATION:${m.channel}`,
                "END:VEVENT"
            );
        });

        icsRows.push("END:VCALENDAR");

        const blob = new Blob([icsRows.join("\r\n")], { type: 'text/calendar;charset=utf-8' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mina_favoritmatcher.ics';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }

    // Initiera vid start
    updateLeagueButtons();
    renderMatches();
</script>

</body>
</html>
