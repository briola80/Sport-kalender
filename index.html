<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olausson Sportkalender & Kanaler</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --primary: #0056b3;
            --primary-hover: #004085;
            --accent: #28a745;
            --text: #212529;
            --text-muted: #6c757d;
            --border: #dee2e6;
            --radius: 12px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            text-align: center;
            color: var(--primary);
        }
        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .filter-btn {
            background: #e9ecef;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
        }
        .filter-btn.active {
            background: var(--primary);
            color: white;
        }
        .match-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 450px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 4px;
        }
        .match-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            transition: border-color 0.2s;
        }
        .match-card.selected {
            border-color: var(--accent);
            background: #f4faf5;
        }
        .match-info {
            flex-grow: 1;
        }
        .match-teams {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 3px;
        }
        .match-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .match-channel {
            color: var(--primary);
            font-weight: 600;
        }
        .match-checkbox {
            transform: scale(1.2);
            cursor: pointer;
            margin-left: 12px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button.action-btn {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        button.action-btn:hover {
            opacity: 0.9;
        }
        .select-all-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-muted);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sportkalender & Kanaler</h1>
    <div class="subtitle">Välj dina matcher och ladda ner din skräddarsydda kalenderfil (.ics)</div>

    <!-- Filterknappar -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterMatches('all')">Alla</button>
        <button class="filter-btn" onclick="filterMatches('Frölunda')">Frölunda HC</button>
        <button class="filter-btn" onclick="filterMatches('IFK Göteborg')">IFK Göteborg</button>
        <button class="filter-btn" onclick="filterMatches('Sverige')">Landslag</button>
    </div>

    <div class="select-all-row">
        <span onclick="toggleSelectAll()">Markera / Avmarkera alla synliga</span>
        <span id="selected-count">0 valda</span>
    </div>

    <!-- Matchlista -->
    <div class="match-list" id="matchList">
        <!-- Genereras dynamiskt via JavaScript -->
    </div>

    <!-- Exportknapp -->
    <div class="actions">
        <button class="action-btn" onclick="generateICS()">Ladda ner .ics för valda matcher</button>
    </div>
</div>

<script>
    // Utökad databas med fler matcher för dina favoritlag
    const matches = [
        { id: 1, team: "Frölunda", title: "Frölunda HC - Malmö Redhawks", league: "SHL", datetime: "2026-11-12T19:00:00", channel: "TV4 Play Hockey / TV12", selected: true },
        { id: 2, team: "Sverige", title: "Sverige - Schweiz", league: "Hockey-VM Dam", datetime: "2026-11-13T19:00:00", channel: "SVT Play / SVT2", selected: true },
        { id: 3, team: "IFK Göteborg", title: "IFK Göteborg - AIK", league: "Allsvenskan", datetime: "2026-11-16T15:00:00", channel: "Max / Discovery+", selected: true },
        { id: 4, team: "Frölunda", title: "Frölunda HC - Färjestad BK", league: "SHL", datetime: "2026-11-19T19:00:00", channel: "TV4 Play Hockey", selected: true },
        { id: 5, team: "Sverige", title: "Sverige - Tjeckien", league: "Landskamp Herr", datetime: "2026-11-21T19:00:00", channel: "SVT / Viaplay", selected: true },
        { id: 6, team: "Frölunda", title: "Luleå HF - Frölunda HC", league: "SHL", datetime: "2026-11-24T19:00:00", channel: "TV4 Play Hockey", selected: false },
        { id: 7, team: "Frölunda", title: "Frölunda HC (Dam) - Luleå (Dam)", league: "SDHL", datetime: "2026-11-25T18:00:00", channel: "SVT Play", selected: false },
        { id: 8, team: "IFK Göteborg", title: "IFK Göteborg - BK Häcken", league: "Allsvenskan", datetime: "2026-11-28T15:00:00", channel: "Max / Discovery+", selected: false },
        { id: 9, team: "Frölunda", title: "Frölunda HC - Skellefteå AIK", league: "SHL", datetime: "2026-11-29T15:15:00", channel: "TV4 / TV4 Play", selected: false },
        { id: 10, team: "Sverige", title: "Sverige - Finland", league: "Beijer Hockey Games", datetime: "2026-12-04T19:00:00", channel: "SVT / Viaplay", selected: false }
    ];

    let currentFilter = 'all';

    function renderMatches() {
        const listEl = document.getElementById('matchList');
        listEl.innerHTML = '';

        const filtered = matches.filter(m => currentFilter === 'all' || m.team === currentFilter);

        filtered.forEach(m => {
            const card = document.createElement('div');
            card.className = `match-card ${m.selected ? 'selected' : ''}`;
            card.onclick = (e) => {
                if(e.target.type !== 'checkbox') {
                    m.selected = !m.selected;
                    renderMatches();
                }
            };

            const dateFormatted = new Date(m.datetime).toLocaleString('sv-SE', {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            card.innerHTML = `
                <div class="match-info">
                    <div class="match-teams">${m.title}</div>
                    <div class="match-meta">
                        <span>📅 ${dateFormatted}</span>
                        <span class="match-channel">📺 ${m.channel}</span>
                    </div>
                </div>
                <input type="checkbox" class="match-checkbox" ${m.selected ? 'checked' : ''} onchange="toggleMatch(${m.id})">
            `;
            listEl.appendChild(card);
        });

        updateCount();
    }

    function filterMatches(category) {
        currentFilter = category;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderMatches();
    }

    function toggleMatch(id) {
        const match = matches.find(m => m.id === id);
        if(match) {
            match.selected = !match.selected;
            renderMatches();
        }
    }

    function toggleSelectAll() {
        const filtered = matches.filter(m => currentFilter === 'all' || m.team === currentFilter);
        const allSelected = filtered.every(m => m.selected);
        filtered.forEach(m => m.selected = !allSelected);
        renderMatches();
    }

    function updateCount() {
        const count = matches.filter(m => m.selected).length;
        document.getElementById('selected-count').innerText = `${count} valda`;
    }

    function generateICS() {
        const selectedMatches = matches.filter(m => m.selected);
        if(selectedMatches.length === 0) {
            alert('Välj minst en match i listan först!');
            return;
        }

        let icsRows = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//Olausson Sportkalender//SV",
            "CALSCALE:GREGORIAN",
            "METHOD:PUBLISH"
        ];

        selectedMatches.forEach(m => {
            const startObj = new Date(m.datetime);
            const endObj = new Date(startObj.getTime() + 150 * 60000); // 2.5 timmars matchtid

            const formatICSDate = (d) => {
                const pad = n => String(n).padStart(2, '0');
                return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
            };

            const dtstart = formatICSDate(startObj);
            const dtend = formatICSDate(endObj);

            icsRows.push(
                "BEGIN:VEVENT",
                `UID:sportmatch-${m.id}-${Date.now()}@sportkalender.local`,
                `DTSTAMP:${dtstart}`,
                `DTSTART:${dtstart}`,
                `DTEND:${dtend}`,
                `SUMMARY:${m.title} (${m.league})`,
                `DESCRIPTION:Sänds på ${m.channel}`,
                `LOCATION:${m.channel}`, // Kanalen hamnar direkt i platsfältet!
                "END:VEVENT"
            );
        });

        icsRows.push("END:VCALENDAR");

        const blob = new Blob([icsRows.join("\r\n")], { type: 'text/calendar;charset=utf-8' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mina_favoritmatcher.ics';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }

    // Initiera appen
    renderMatches();
</script>

</body>
</html>
