<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olausson Sportkalender & Kanaler</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --primary: #0056b3;
            --accent: #28a745;
            --text: #212529;
            --text-muted: #6c757d;
            --border: #dee2e6;
            --radius: 12px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 6px;
            text-align: center;
            color: var(--primary);
        }
        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 16px;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .match-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 500px;
            overflow-y: auto;
            margin-bottom: 16px;
            padding-right: 4px;
        }
        .match-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
        }
        .match-card.selected {
            border-color: var(--accent);
            background: #f4faf5;
        }
        .match-info {
            flex-grow: 1;
        }
        .match-teams {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }
        .match-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .match-channel {
            color: var(--primary);
            font-weight: 600;
        }
        .match-checkbox {
            transform: scale(1.2);
            cursor: pointer;
            margin-left: 10px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        button.action-btn {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        button.action-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Olausson Sportkalender</h1>
    <div class="subtitle">Hämtar samtliga matcher direkt från din GitHub-kalender</div>

    <div id="loading" class="loading">Laddar in matcher från kalendern...</div>
    
    <div class="match-list" id="matchList" style="display:none;"></div>

    <div class="actions" id="actions" style="display:none;">
        <button class="action-btn" onclick="generateICS()">Ladda ner .ics för markerade matcher</button>
    </div>
</div>

<script>
    let matches = [];

    // Läs in din publika master-ICS från GitHub
    async function laddaKalender() {
        const icsUrl = 'https://raw.githubusercontent.com/briola80/Sport-kalender/refs/heads/main/kalender.ics';
        
        try {
            // Använder en öppen CORS-proxy för att kunna läsa filen direkt i webbläsaren
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(icsUrl);
            const response = await fetch(proxyUrl);
            const text = await response.text();
            
            parsaICS(text);
        } catch (e) {
            console.error("Kunde inte ladda kalender:", e);
            document.getElementById('loading').innerText = "Kunde inte ladda matcherna. Kontrollera din anslutning.";
        }
    }

    function parsaICS(icsText) {
        matches = [];
        const rader = icsText.split(/\r?\n/);
        let aktuellHändelse = null;
        let idCounter = 1;

        rader.forEach(rad => {
            if (rad === 'BEGIN:VEVENT') {
                aktuellHändelse = { id: idCounter++, selected: false };
            } else if (rad === 'END:VEVENT' && aktuellHändelse) {
                if (aktuellHändelse.summary && aktuellHändelse.dtstart) {
                    matches.push(aktuellHändelse);
                }
                aktuellHändelse = null;
            } else if (aktuellHändelse) {
                if (rad.startsWith('SUMMARY:')) {
                    aktuellHändelse.summary = rad.substring(8);
                } else if (rad.startsWith('DTSTART')) {
                    const datumStr = rad.split(':')[1];
                    aktuellHändelse.dtstart = omvandlaICSDatum(datumStr);
                } else if (rad.startsWith('LOCATION:')) {
                    aktuellHändelse.location = rad.substring(9);
                }
            }
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('matchList').style.display = 'flex';
        document.getElementById('actions').style.display = 'flex';
        
        renderMatches();
    }

    function omvandlaICSDatum(str) {
        if (!str || str.length < 8) return new Date();
        const ar = str.substring(0, 4);
        const man = str.substring(4, 6);
        const dag = str.substring(6, 8);
        let tim = "00", min = "00";
        if (str.includes('T') && str.length >= 13) {
            tim = str.substring(9, 11);
            min = str.substring(11, 13);
        }
        return new Date(`${ar}-${man}-${dag}T${tim}:${min}:00`);
    }

    function renderMatches() {
        const listEl = document.getElementById('matchList');
        listEl.innerHTML = '';

        if (matches.length === 0) {
            listEl.innerHTML = '<div style="text-align:center; color:#6c757d; padding: 20px;">Inga matcher hittades.</div>';
            return;
        }

        matches.forEach(m => {
            const card = document.createElement('div');
            card.className = `match-card ${m.selected ? 'selected' : ''}`;
            card.onclick = (e) => {
                if(e.target.type !== 'checkbox') {
                    m.selected = !m.selected;
                    renderMatches();
                }
            };

            const datumFormat = m.dtstart.toLocaleString('sv-SE', {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            card.innerHTML = `
                <div class="match-info">
                    <div class="match-teams">${m.summary}</div>
                    <div class="match-meta">
                        <span>📅 ${datumFormat}</span>
                        <span class="match-channel">📺 ${m.location || 'Ej angiven'}</span>
                    </div>
                </div>
                <input type="checkbox" class="match-checkbox" ${m.selected ? 'checked' : ''} onchange="toggleMatch(${m.id})">
            `;
            listEl.appendChild(card);
        });
    }

    function toggleMatch(id) {
        const match = matches.find(m => m.id === id);
        if(match) {
            match.selected = !match.selected;
            renderMatches();
        }
    }

    function generateICS() {
        const valda = matches.filter(m => m.selected);
        if(valda.length === 0) {
            alert('Välj minst en match först!');
            return;
        }

        let icsRows = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//Olausson Sportkalender//SV",
            "CALSCALE:GREGORIAN",
            "METHOD:PUBLISH"
        ];

        valda.forEach(m => {
            const startStr = m.dtstart.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            icsRows.push(
                "BEGIN:VEVENT",
                `UID:valbar-match-${m.id}-${Date.now()}@sportkalender.local`,
                `DTSTAMP:${startStr}`,
                `DTSTART:${startStr}`,
                `SUMMARY:${m.summary}`,
                `LOCATION:${m.location || ''}`,
                "END:VEVENT"
            );
        });

        icsRows.push("END:VCALENDAR");

        const blob = new Blob([icsRows.join("\r\n")], { type: 'text/calendar;charset=utf-8' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mina_valda_matcher.ics';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }

    // Starta inläsningen vid sidladdning
    laddaKalender();
</script>

</body>
</html>
